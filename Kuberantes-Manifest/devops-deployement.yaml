apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-deploy
  namespace: default # 1. Added the missing namespace here
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-deploy
  template:
    metadata:
      labels:
        app: devops-deploy
    spec:
      containers:
      - name: devops-container
        image: nykiee/devops:beta
        ports:
        - containerPort: 8080
        # 2. Fixed indentation for the startup probe
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          failureThreshold: 10
          periodSeconds: 10
          initialDelaySeconds: 15
        # 3. Fixed indentation for the liveness probe
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 2
          initialDelaySeconds: 5
